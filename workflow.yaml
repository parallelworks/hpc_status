# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
#
# HPC Status Monitor - ACTIVATE Workflow
#
# Serves the dashboard through `pw endpoints run`, which assigns a free
# local port, dials out to register a reverse tunnel, and tears the whole
# process tree down when it exits. That replaces the previous
# sessions/update-session pair, and with it three problems:
#
#   - the fixed port 8080, which is Grafana on an ACTIVATE workspace, so
#     the run died on "Address already in use"
#   - the poll loop that curled the port up to 1000 times waiting for the
#     server to appear
#   - dashboards outliving their run, because nothing owned the process
#     once the session was registered

permissions:
  - "*"

on:
  execute:
    inputs:
      platform:
        type: dropdown
        label: Platform
        default: generic
        tooltip: Select the deployment platform configuration
        options:
          - label: Generic
            value: generic
          - label: HPCMP
            value: hpcmp
          - label: NOAA
            value: noaa
      settings:
        type: group
        label: Settings
        collapsed: true
        items:
          name:
            type: string
            label: Endpoint Name
            default: hpc-status
            tooltip: Name of the endpoint session, shown in your sessions list
          repo_url:
            type: string
            label: Source Repository
            default: https://github.com/parallelworks/hpc_status.git
            tooltip: >-
              Where to fetch the dashboard from. The runner does not check
              the repository out, so the workflow clones it itself.
          repo_branch:
            type: string
            label: Branch
            default: main
            tooltip: Branch to run
          port:
            type: number
            label: Local Port
            default: 0
            tooltip: >-
              Local port the dashboard binds on the node. Leave at 0 to let
              the CLI pick a free one — set it only if you need a
              predictable port, and note that 8080 is already Grafana.
          theme:
            type: dropdown
            label: UI Theme
            default: light
            tooltip: Default color theme for the dashboard
            options:
              - label: Dark
                value: dark
              - label: Light
                value: light
          enable_cluster_pages:
            type: boolean
            label: Enable Cluster Pages
            default: true
            tooltip: Enable queue and quota monitoring pages
          enable_cluster_monitor:
            type: boolean
            label: Enable Cluster Monitor
            default: true
            tooltip: Enable background cluster data collection
          cluster_monitor_interval:
            type: number
            label: Refresh Interval
            default: 120
            tooltip: Data refresh interval in seconds

jobs:
  serve_dashboard:
    steps:
      - name: Serve the HPC Status Monitor as an endpoint
        env:
          # PORT is deliberately absent: `pw endpoints run` exports the
          # port it assigned, and scripts/run.sh reads it. Setting it here
          # would pin the server to a port the tunnel is not watching.
          HOST: "127.0.0.1"
          DEFAULT_THEME: ${{ inputs.settings.theme }}
          ENABLE_CLUSTER_PAGES: ${{ inputs.settings.enable_cluster_pages && '1' || '0' }}
          ENABLE_CLUSTER_MONITOR: ${{ inputs.settings.enable_cluster_monitor && '1' || '0' }}
          CLUSTER_MONITOR_INTERVAL: ${{ inputs.settings.cluster_monitor_interval }}
          CONFIG_FILE: ${{ inputs.platform == 'hpcmp' && 'configs/config.hpcmp.yaml' || inputs.platform == 'noaa' && 'configs/config.noaa.yaml' || 'configs/config.yaml' }}
          ENDPOINT_NAME: ${{ inputs.settings.name }}
          PINNED_PORT: ${{ inputs.settings.port }}
          REPO_URL: ${{ inputs.settings.repo_url }}
          REPO_BRANCH: ${{ inputs.settings.repo_branch }}
        run: |
          set -euo pipefail

          echo "Platform: ${{ inputs.platform }}"
          echo "Config:   ${CONFIG_FILE}"
          echo "Theme:    ${DEFAULT_THEME}"

          if ! command -v pw >/dev/null 2>&1; then
            echo "The pw CLI is not on PATH; it is required to publish the" >&2
            echo "dashboard as an endpoint session." >&2
            exit 1
          fi

          # The runner starts the step in a job directory holding only
          # inputs and logs — it does not check the repository out — so
          # the workflow fetches its own source and launches it by
          # absolute path. (`pw endpoints run` fork/execs the command
          # rather than going through a shell, and run.sh cd's to its own
          # project root, so the path to the file is all that matters.)
          echo "Workflow environment:"
          env | grep -E '^(PW_|WORKFLOW|REPO|GIT_)' | grep -viE 'key|token|secret|pass' | sort || true

          checkout="${HOME}/pw/src/hpc_status"
          if [ -d "${checkout}/.git" ]; then
            echo "Updating ${checkout}"
            git -C "${checkout}" fetch --depth 1 origin "${REPO_BRANCH}"
            git -C "${checkout}" reset --hard "origin/${REPO_BRANCH}"
          else
            echo "Cloning ${REPO_URL} (${REPO_BRANCH}) into ${checkout}"
            mkdir -p "$(dirname "${checkout}")"
            git clone --depth 1 --branch "${REPO_BRANCH}" "${REPO_URL}" "${checkout}"
          fi

          launcher="${checkout}/scripts/run.sh"
          if [ ! -f "${launcher}" ]; then
            echo "Cannot find scripts/run.sh under ${checkout}" >&2
            ls -la "${checkout}" >&2
            exit 1
          fi

          # 0 means "let the CLI find a free port", which is the default.
          port_args=""
          if [ "${PINNED_PORT:-0}" -gt 0 ]; then
            port_args="--port ${PINNED_PORT}"
          fi

          # The endpoint owns the dashboard: it exports PORT and
          # PW_ENDPOINT_PATH for run.sh to pick up, forwards the session
          # URL to it, and kills the process tree when the run ends.
          # `bash <script>` rather than the script itself, so a checkout
          # that lost the executable bit still starts.
          exec pw endpoints run \
            --name "${ENDPOINT_NAME}" \
            ${port_args} \
            -- bash "${launcher}"
