# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
#
# HPC Status Monitor - ACTIVATE Workflow
#
# Serves the dashboard through `pw endpoints run`: it assigns a free local
# port, dials out to register a reverse tunnel (so the node needs no
# inbound access), and tears the whole process tree down when it exits.
#
# That replaced a sessions/update-session pair which pinned port 8080 —
# Grafana on an ACTIVATE workspace, so the run died on "Address already in
# use" — polled the port up to 1000 times waiting for the server, and left
# dashboards running after their session was registered.
#
# The three deployment YAMLs differ only in their defaults; the logic they
# share lives in scripts/serve-endpoint.sh, and a test keeps them aligned.

permissions:
  - "*"

on:
  execute:
    inputs:
      host:
        type: compute-resources
        label: Where To Run
        include-workspace: true
        optional: true
        tooltip: >-
          Leave blank to run on your user workspace, which is the default
          and needs no setup. Pick a cluster to keep the dashboard serving
          when the workspace recycles — that host needs the pw CLI on its
          PATH, and the run reports plainly if it does not have it.
      platform:
        type: dropdown
        label: Platform
        default: auto
        tooltip: >-
          Which configuration to load. Auto picks it from the platform the
          run is on, so a marketplace launch on a DoD host comes up with
          the HPCMP fleet rather than a generic deployment.
        options:
          - label: Auto-detect
            value: auto
          - label: Generic
            value: generic
          - label: HPCMP
            value: hpcmp
          - label: NOAA
            value: noaa
      settings:
        type: group
        label: Settings
        collapsed: true
        items:
          name:
            type: string
            label: Endpoint Name
            default: hpc-status
            tooltip: Name of the endpoint session, shown in your sessions list
          detach:
            type: boolean
            label: Keep Serving After The Run Ends
            default: true
            tooltip: >-
              On, the run finishes in seconds and the dashboard keeps
              serving on the workspace key, which outlives the run; stop it
              by deleting the session. Off, the run stays open for as long
              as the dashboard does and cancelling it stops everything.
          subdomain:
            type: string
            label: Public Subdomain
            default: ""
            tooltip: >-
              Hostname label for the dashboard, so the URL stays the same
              between runs. Blank derives status-<username>. Reserve it
              with `pw subdomains reserve <name>` to keep it yours.
          repo_url:
            type: string
            label: Source Repository
            default: https://github.com/parallelworks/hpc_status.git
            tooltip: >-
              Where to fetch the dashboard from. The runner does not check
              the repository out, so the workflow clones it itself.
          repo_branch:
            type: string
            label: Branch
            default: main
            tooltip: Branch to run
          port:
            type: number
            label: Local Port
            default: 0
            tooltip: >-
              Local port the dashboard binds on the node. Leave at 0 to let
              the CLI pick a free one — set it only if you need a
              predictable port, and note that 8080 is already Grafana.
          theme:
            type: dropdown
            label: UI Theme
            default: light
            tooltip: Default color theme for the dashboard
            options:
              - label: Dark
                value: dark
              - label: Light
                value: light
          enable_cluster_pages:
            type: boolean
            label: Enable Cluster Pages
            default: true
            tooltip: Enable queue and quota monitoring pages
          enable_cluster_monitor:
            type: boolean
            label: Enable Cluster Monitor
            default: true
            tooltip: Enable background cluster data collection
          cluster_monitor_interval:
            type: number
            label: Refresh Interval
            default: 120
            tooltip: Data refresh interval in seconds

jobs:
  serve_dashboard:
    # An empty remoteHost runs the step where the workflow runs — the
    # platform says so itself ("ssh.remoteHost is empty; running this step
    # on localhost"), so the picker needs no branching: blank is the user
    # workspace, a chosen host is that host.
    ssh:
      remoteHost: ${{ inputs.host.ip }}
    steps:
      - name: Serve the HPC Status Monitor as an endpoint
        env:
          # PORT is deliberately absent: `pw endpoints run` exports the
          # port it assigned and scripts/run.sh reads it. Pinning it here
          # would bind the server to a port the tunnel is not watching.
          HOST: "127.0.0.1"
          DEFAULT_THEME: ${{ inputs.settings.theme }}
          ENABLE_CLUSTER_PAGES: ${{ inputs.settings.enable_cluster_pages && '1' || '0' }}
          ENABLE_CLUSTER_MONITOR: ${{ inputs.settings.enable_cluster_monitor && '1' || '0' }}
          CLUSTER_MONITOR_INTERVAL: ${{ inputs.settings.cluster_monitor_interval }}
          # Empty when platform is 'auto': a ${{ }} expression cannot see
          # the host, so scripts/serve-endpoint.sh resolves it there.
          CONFIG_FILE: ${{ inputs.platform == 'hpcmp' && 'configs/config.hpcmp.yaml' || inputs.platform == 'noaa' && 'configs/config.noaa.yaml' || inputs.platform == 'generic' && 'configs/config.yaml' || '' }}
          ENDPOINT_NAME: ${{ inputs.settings.name }}
          ENDPOINT_SUBDOMAIN: ${{ inputs.settings.subdomain }}
          DETACH: ${{ inputs.settings.detach && '1' || '0' }}
          PINNED_PORT: ${{ inputs.settings.port }}
          REPO_URL: ${{ inputs.settings.repo_url }}
          REPO_BRANCH: ${{ inputs.settings.repo_branch }}
        run: |
          set -euo pipefail

          echo "Platform: ${{ inputs.platform }}"
          echo "Config:   ${CONFIG_FILE}"

          # Locate the source. Some platform versions check the repository
          # out into the job directory and some hand the step an empty one,
          # so find it or fetch it rather than assuming either.
          if [ -f "${PWD}/scripts/serve-endpoint.sh" ]; then
            checkout="${PWD}"
          else
            checkout="${HOME}/pw/src/hpc_status"
            if [ -d "${checkout}/.git" ]; then
              git -C "${checkout}" fetch --depth 1 origin "${REPO_BRANCH}"
              git -C "${checkout}" reset --hard "origin/${REPO_BRANCH}"
            else
              mkdir -p "$(dirname "${checkout}")"
              git clone --depth 1 --branch "${REPO_BRANCH}" \
                "${REPO_URL}" "${checkout}"
            fi
          fi
          echo "Source:   ${checkout}"

          exec bash "${checkout}/scripts/serve-endpoint.sh"
