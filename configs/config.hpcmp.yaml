# HPC Status Monitor - HPCMP Deployment Configuration
# Use with: python -m src.server.main --config configs/config.hpcmp.yaml

deployment:
  name: "HPCMP Status Monitor"
  platform: hpcmp

server:
  host: "0.0.0.0"
  port: 8080

collectors:
  pw_cluster:
    enabled: true
    refresh_interval: 120
  pw_marketplace:
    # Compute listings from the platform marketplace: what exists and what
    # each machine is for. Adds descriptions to the fleet page and surfaces
    # systems no status page publishes. Not a status source.
    enabled: true
    timeout: 30

  hpcmp:
    enabled: true
    url: "https://centers.hpc.mil/systems/unclassified.html"
    refresh_interval: 180
    timeout: 30

ui:
  title: "HPCMP Fleet Status"
  eyebrow: "HPCMP FLEET"
  home_page: "fleet"
  default_theme: "dark"
  tabs:
    fleet: true
    topology: true
    queues: true
    quota: true
    storage: true
    api: true
    overview: false

rate_limiting:
  # Clusters swept at once. Each cluster is still handled by one thread
  # start to finish, so this never opens two sessions to the same system —
  # it only overlaps different ones. A fleet of 19 took ~6 minutes
  # sequentially and ~1m40s at 3.
  max_concurrent_ssh: 6
  ssh_timeout: 30
  retry_backoff: [5, 15, 60]
  per_cluster:
    min_interval: 60
    max_commands_per_poll: 5
  circuit_breaker:
    failure_threshold: 3
    pause_duration: 300

# Alerting on system state changes (UP -> DOWN, recoveries, ...).
# Disabled by default; any endpoint accepting a JSON POST works, including
# Slack and Teams incoming webhooks.
alerts:
  enabled: false
  webhook_url: ""
  # info | warning | critical
  min_severity: warning
  # Per-system quiet period so a flapping machine alerts once, not sixty times.
  cooldown_seconds: 900
  # Optional link included in the alert text.
  dashboard_url: ""

# Topology view (Topology tab)
topology:
  # Resolve login-node hostnames to IP addresses in the background.
  resolve_addresses: true
  address_ttl_seconds: 3600
  # Window for the per-system uptime percentage shown in the inspector.
  uptime_window_hours: 24
  # hierarchy | radial | force | lanes | geo
  default_layout: hierarchy
  # Trailing window used to measure queue turnover for wait estimates.
  wait_estimate_window_hours: 6
  # Extend or override the built-in site catalog (name/organization/
  # location/lat/lon), keyed by the site id the collector reports.
  sites: {}
  # Place systems nothing else can identify — not on a status page, and a
  # login hostname with no site in it. Keyed by system name (slugified).
  #
  # This deployment already gets the HPCMP name hints (chessie and janus
  # at ARL, crux at MHPCC); this is for anything else.
  #   system_sites:
  #     mycluster: erdc
  system_sites: {}
  # Every HPCMP cloud resource lives in AWS GovCloud (US-West), so cloud
  # clusters whose hostname does not name a region are placed there rather
  # than on a provider pin with no coordinates.
  cloud_region_default: usgovwest1
